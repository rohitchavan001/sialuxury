<footer class="luxury-footer">
  <div class="container footer-clean-inner">
    <!-- Brand Mark -->
    <div class="footer-brand">
      <h2 class="brand-title serif-heading">SIA LUXURY</h2>
      <p class="brand-tagline">Haute Couture & Heritage Indian Occasion Wear</p>
    </div>

    <!-- Clean Horizontal Navigation -->
    <nav class="footer-nav" aria-label="Footer Navigation">
      <a routerLink="/about">About Maison</a>
      <a routerLink="/products" [queryParams]="{category: 'All'}">All Creations</a>
      <a routerLink="/products" [queryParams]="{category: 'Lehenga'}">Bridal Lehengas</a>
      <a routerLink="/wishlist">Saved Wishlist</a>
      <a routerLink="/profile">Client Profile</a>
      <a routerLink="/cart">Shopping Bag</a>
    </nav>

    <!-- WhatsApp Concierge Button -->
    <div class="footer-whatsapp-wrap">
      <a 
        href="https://wa.me/919876543210?text=Hello%20SIA%20LUXURY,%20I%20am%20inquiring%20about%20your%20haute%20couture%20collection." 
        target="_blank" 
        rel="noopener noreferrer" 
        class="footer-whatsapp-pill"
        aria-label="Chat on WhatsApp"
      >
        <i class="fa-brands fa-whatsapp"></i>
        <span>Chat on WhatsApp</span>
      </a>
    </div>

    <!-- Subtle Social Icons -->
    <div class="footer-social">
      <a href="https://wa.me/919876543210" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="social-wa-btn"><i class="fa-brands fa-whatsapp"></i></a>
      <a href="javascript:void(0)" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="javascript:void(0)" aria-label="Pinterest"><i class="fa-brands fa-pinterest-p"></i></a>
      <a href="javascript:void(0)" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    </div>

    <!-- Understated Copyright -->
    <div class="footer-bottom-line">
      <span>&copy; 2026 SIA LUXURY ATELIER. ALL RIGHTS RESERVED.</span>
    </div>
  </div>
</footer>
