<!-- Backdrop -->
<div class="sidebar-backdrop" *ngIf="cartService.isSidebarOpen" (click)="close()"></div>

<!-- Slideout Sidebar Panel -->
<aside class="luxury-sidebar" [class.open]="cartService.isSidebarOpen">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sub">EXCLUSIVE COLLECTION</span>
      <h3>SIA LUXURY</h3>
    </div>
    <button class="close-btn" (click)="close()" aria-label="Close Menu">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="sidebar-body">
    <!-- Quick Utility Bar for Mobile -->
    <div class="sidebar-quick-bar">
      <a routerLink="/wishlist" (click)="close()" class="quick-pill">
        <i class="fa-regular fa-heart"></i>
        <span>Wishlist ({{ cartService.wishlistIds.length }})</span>
      </a>
      <a routerLink="/profile" (click)="close()" class="quick-pill">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </a>
    </div>

    <!-- 1. Main Collections -->
    <div class="sidebar-section">
      <span class="section-label">COLLECTIONS</span>
      <ul class="couture-nav-list">
        <li *ngFor="let item of mainMenus">
          <a [routerLink]="item.path" [queryParams]="item.query ? {category: item.query} : null" (click)="close()">
            <span class="menu-name">{{ item.name }}</span>
            <span class="menu-badge" *ngIf="item.badge">{{ item.badge }}</span>
            <i class="fa-solid fa-chevron-right arrow-icon" *ngIf="!item.badge"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- 2. Women's Categories -->
    <div class="sidebar-section">
      <span class="section-label">WOMEN</span>
      <ul class="cat-links">
        <li *ngFor="let cat of womenCategories">
          <a routerLink="/products" [queryParams]="{category: cat.query}" (click)="close()">
            <span>{{ cat.name }}</span>
            <i class="fa-solid fa-arrow-right-long arrow-icon"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- 3. Men's Categories -->
    <div class="sidebar-section">
      <span class="section-label">MEN</span>
      <ul class="cat-links">
        <li *ngFor="let cat of menCategories">
          <a routerLink="/products" [queryParams]="{category: cat.query}" (click)="close()">
            <span>{{ cat.name }}</span>
            <i class="fa-solid fa-arrow-right-long arrow-icon"></i>
          </a>
        </li>
      </ul>
    </div>

    <!-- 4. Quick Help Links -->
    <div class="sidebar-section">
      <span class="section-label">MORE</span>
      <ul class="nav-links">
        <li>
          <a routerLink="/about" (click)="close()"><i class="fa-regular fa-circle-question gold-icon"></i> About Us</a>
        </li>
        <li>
          <a routerLink="/cart" (click)="close()"><i class="fa-solid fa-bag-shopping gold-icon"></i> Bag ({{ cartService.getCartCount() }})</a>
        </li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <div class="contact-info">
        <p><i class="fa-solid fa-phone gold-icon"></i> +91 98765 43210</p>
        <p><i class="fa-regular fa-envelope gold-icon"></i> help&#64;sialuxury.com</p>
      </div>
    </div>
  </div>
</aside>
