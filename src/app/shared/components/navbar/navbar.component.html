<header class="sia-header">
  <!-- Top Bar with Currency, Brand, and Utilities -->
  <div class="header-top container">
    <!-- Left: Hamburger (Mobile) + Currency + Search (Desktop) -->
    <div class="header-left">
      <!-- Hamburger Menu for Mobile (Left Side) -->
      <button class="mobile-menu-btn" (click)="toggleSidebar()" aria-label="Open Menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="currency-dropdown">
        <button class="currency-btn" (click)="toggleCurrencyMenu()">
          <span>{{ cartService.currency }}</span>
          <i class="fa-solid fa-chevron-down arrow-down"></i>
        </button>
        <div class="currency-menu" *ngIf="showCurrencyMenu">
          <button (click)="selectCurrency('INR')">INR</button>
          <button (click)="selectCurrency('USD')">USD</button>
          <button (click)="selectCurrency('EUR')">EUR</button>
        </div>
      </div>

      <!-- Desktop Search Toggle -->
      <button class="icon-btn search-toggle desktop-search-btn" (click)="showSearch = !showSearch" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- Desktop Search Drawer -->
      <div class="search-drawer desktop-search-drawer" *ngIf="showSearch">
        <input 
          type="text" 
          placeholder="Search collections..." 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="onSearch()"
          autofocus
        />
        <button (click)="onSearch()"><i class="fa-solid fa-arrow-right"></i></button>
        <button (click)="showSearch = false"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <!-- Center: Brand Logo -->
    <div class="header-center">
      <a routerLink="/" class="brand-title">SIA LUXURY</a>
    </div>

    <!-- Right: Search (Mobile), User, Wishlist, Bag -->
    <div class="header-right">
      <!-- Mobile Search Button (Right Side) -->
      <button class="icon-btn search-toggle mobile-search-btn" (click)="showSearch = !showSearch" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <a routerLink="/profile" class="icon-btn account-btn" title="Client Profile">
        <i class="fa-regular fa-user"></i>
      </a>
      <a routerLink="/wishlist" class="icon-btn" title="Saved Wishlist">
        <i class="fa-regular fa-heart"></i>
      </a>
      <button class="icon-btn cart-btn" (click)="toggleCartDrawer()" aria-label="Shopping Bag">
        <i class="fa-solid fa-bag-shopping"></i>
      </button>
    </div>

    <!-- Mobile Full-Width Search Bar Overlay (Drops below header when active) -->
    <div class="mobile-search-bar" *ngIf="showSearch">
      <div class="mobile-search-inner">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
          type="text" 
          placeholder="Search couture, sarees, lehengas..." 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="onSearch()"
          autofocus
        />
        <button type="button" class="search-submit-btn" (click)="onSearch()" aria-label="Submit search">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button type="button" class="search-close-btn" (click)="showSearch = false" aria-label="Close search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Navigation Row: Clean, simple & compact -->
  <nav class="header-nav">
    <div class="container nav-links-wrap">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">HOME</a>
      <a routerLink="/products" [queryParams]="{category: 'All'}" routerLinkActive="active">NEW ARRIVALS</a>
      <a routerLink="/products" [queryParams]="{category: 'All'}" routerLinkActive="active">COLLECTION</a>
      <a routerLink="/products" [queryParams]="{category: 'Lehenga'}" routerLinkActive="active">FESTIVAL EDIT</a>
      <a routerLink="/products" [queryParams]="{category: 'All'}" routerLinkActive="active">READY TO SHIP</a>
      <a routerLink="/about" routerLinkActive="active">CLIENT DIARIES</a>
      <a routerLink="/about" routerLinkActive="active">CONTACT</a>
    </div>
  </nav>
</header>
